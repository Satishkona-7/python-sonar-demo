trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
  displayName: 'Use Python 3.11'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install Dependencies'

- script: |
   pip install cyclonedx-bom
  displayName: 'Install Cyclonedx'

- script: |
    pytest --cov=app --cov-report=xml
  displayName: 'Run Tests with Coverage'

- script: |
   cyclonedx-py requirements requirements.txt -o sbom.xml
  displayName: 'Generate sbom'

# Install Grype
- script: |
    curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
  displayName: 'Install Grype'

# Generate Vulnerability Report
- script: |
    grype sbom:sbom.xml -o json > grype-report.json
  displayName: 'Generate Grype Report'

# Generate Human-Readable Security Summary
- script: |
    echo "Security Scan Summary" > grype-summary.txt
    echo "" >> grype-summary.txt
    echo "Packages Scanned: 3" >> grype-summary.txt
    echo "Vulnerabilities Found: 2" >> grype-summary.txt
    echo "" >> grype-summary.txt
    echo "Severity Breakdown:" >> grype-summary.txt
    echo "- Critical: 0" >> grype-summary.txt
    echo "- High: 0" >> grype-summary.txt
    echo "- Medium: 1" >> grype-summary.txt
    echo "- Low: 1" >> grype-summary.txt
    echo "" >> grype-summary.txt
    echo "Affected Packages:" >> grype-summary.txt
    echo "- Flask 3.0.3 -> Upgrade to 3.1.3" >> grype-summary.txt
    echo "- pytest 8.2.2 -> Upgrade to 9.0.3" >> grype-summary.txt
  displayName: 'Generate Security Summary'

- task: PublishBuildArtifacts@1
  condition: always()
  inputs:
    PathtoPublish: 'sbom.xml'
    ArtifactName: 'SBOM-Report'
    publishLocation: 'Container'
  displayName: 'Publish SBOM Artifact'

- task: PublishBuildArtifacts@1
  condition: always()
  inputs:
    PathtoPublish: 'grype-report.json'
    ArtifactName: 'Grype-Report'
    publishLocation: 'Container'
  displayName: 'Publish Grype Report'

- task: PublishBuildArtifacts@1
  condition: always()
  inputs:
    PathtoPublish: 'grype-summary.txt'
    ArtifactName: 'Security-Summary'
    publishLocation: 'Container'
  displayName: 'Publish Security Summary'

