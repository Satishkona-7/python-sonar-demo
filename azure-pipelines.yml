trigger:
- master

pool:
  vmImage: ubuntu-latest

steps:

- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'
  displayName: 'Use Python 3.11'

- script: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt
  displayName: 'Install Dependencies'

- script: |
   pip install cyclonedx-bom
  displayName: 'Install Cyclonedx'

- script: |
    pytest --cov=app --cov-report=xml
  displayName: 'Run Tests with Coverage'

- script: |
   cyclonedx-py requirements requirements.txt -o sbom.xml
  displayName: 'Generate sbom'

# Install Grype
- script: |
    curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
  displayName: 'Install Grype'

# Generate Vulnerability Report
- script: |
    grype sbom:sbom.xml -o table > grype-report.txt
  displayName: 'Generate Grype Report'

- task: PublishBuildArtifacts@1
  condition: always()
  inputs:
    PathtoPublish: 'sbom.xml'
    ArtifactName: 'SBOM-Report'
    publishLocation: 'Container'
  displayName: 'Publish SBOM Artifact'

- task: PublishBuildArtifacts@1
  condition: always()
  inputs:
    PathtoPublish: 'grype-report.txt'
    ArtifactName: 'Grype-Report'
    publishLocation: 'Container'
  displayName: 'Publish Grype Report'


# Fail Pipeline on HIGH/CRITICAL
- script: |
    grype sbom:sbom.xml --fail-on medium
  displayName: 'Fail Pipeline on High Vulnerabilities'

- task: SonarCloudPrepare@4
  inputs:
    SonarQube: 'sonarcloud'
    organization: 'konasatish4444'
    scannerMode: 'cli'
    configMode: 'manual'
    cliProjectKey: 'konasatish4444_python-sonar-demo'
    cliSources: '.'
    extraProperties: 'sonar.python.coverage.reportPaths=coverage.xml'

- task: SonarCloudAnalyze@4

- task: SonarCloudPublish@4
  inputs:
    pollingTimeoutSec: '300'